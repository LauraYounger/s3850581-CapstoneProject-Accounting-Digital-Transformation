packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5.
  '@types/express': '^5.0.1'

  postcss: '^8.5.18'
  sharp: '^0.35.4'
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'

  # Keep both feature-branch and main security fixes.
  proxy-addr: '^2.0.8'
  '@grpc/grpc-js': '^1.13.6'
  qs: '^6.16.0'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true